[package]
name = "core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8.4"
rsa = "0.9.9"
hmac = "0.12.1"
sha2 = "0.10.9"
base64 = "0.22.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.42", features = ["serde"] }
cbc = "0.1.2"
block-padding = "0.3"
machineid-rs = "1.2.4"
