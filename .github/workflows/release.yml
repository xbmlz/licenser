name: Release Libraries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ==========================================
  # Windows x64
  # ==========================================
  build-windows:
    name: Build Windows x64 DLL
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build DLL
        run: cargo build --release

      - name: Prepare DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-files | Out-Null

          $files = Get-ChildItem target/release/*.dll -ErrorAction SilentlyContinue

          if (-not $files) {
            throw "No DLL files found in target/release"
          }

          foreach ($file in $files) {
            $newName = [System.IO.Path]::GetFileNameWithoutExtension($file.Name) + "-windows-x86_64.dll"
            Copy-Item $file.FullName "release-files/$newName"
          }

          Get-ChildItem release-files

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: release-files/*.dll
          if-no-files-found: error

  # ==========================================
  # Linux x86_64
  # CentOS 7.9 compatible build environment
  # ==========================================
  build-linux-x86_64:
    name: Build Linux x86_64 SO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SO in CentOS 7
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            centos:7.9.2009 \
            bash -c '
              set -e

              # Configure CentOS 7 Vault repositories
              sed -i "s|mirrorlist=|#mirrorlist=|g" \
                /etc/yum.repos.d/CentOS-Base.repo

              sed -i "s|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" \
                /etc/yum.repos.d/CentOS-Base.repo

              yum clean all
              yum makecache

              yum groupinstall -y "Development Tools"
              yum install -y openssl-devel pkgconfig wget curl

              curl --proto "=https" --tlsv1.2 -sSf \
                https://sh.rustup.rs | sh -s -- -y

              source "$HOME/.cargo/env"

              pkg-config --modversion openssl

              cargo build --release
            '

      - name: Prepare Linux x86_64 Libraries
        run: |
          set -e

          mkdir -p release-files

          count=0

          for file in target/release/*.so; do
            [ -f "$file" ] || continue

            filename=$(basename "$file" .so)
            cp "$file" "release-files/${filename}-linux-x86_64.so"

            count=$((count + 1))
          done

          if [ "$count" -eq 0 ]; then
            echo "No Linux x86_64 shared libraries found"
            exit 1
          fi

          ls -lah release-files

      - name: Upload Linux x86_64
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: release-files/*.so
          if-no-files-found: error

  # ==========================================
  # Linux ARM64
  # Target: Kylin V10, glibc 2.28
  # ==========================================
  build-linux-aarch64:
    name: Build Linux ARM64 SO
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SO for Kylin V10 ARM64
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            quay.io/pypa/manylinux_2_28_aarch64 \
            bash -lc '
              set -e

              # Install OpenSSL development dependencies
              yum install -y openssl-devel pkgconf-pkg-config

              export PKG_CONFIG_PATH="/usr/lib64/pkgconfig:/usr/local/lib/pkgconfig"

              # Verify OpenSSL
              pkg-config --modversion openssl
              pkg-config --cflags --libs openssl

              # Install Rust
              curl --proto "=https" --tlsv1.2 -sSf \
                https://sh.rustup.rs | sh -s -- -y

              source "$HOME/.cargo/env"

              echo "Architecture:"
              uname -m

              rustc -vV

              # Build native ARM64 library
              cargo build --release
            '

      - name: Check Linux ARM64 Libraries
        run: |
          set -e

          echo "ARM64 shared libraries:"

          find target/release -maxdepth 1 -type f -name "*.so" -print

          files=(target/release/*.so)

          if [ ! -f "${files[0]}" ]; then
            echo "No ARM64 shared libraries found"
            exit 1
          fi

          file "${files[@]}"

          readelf -h "${files[0]}" | grep -E "Class:|Machine:"

      - name: Prepare Linux ARM64 Libraries
        run: |
          set -e

          mkdir -p release-files

          count=0

          for file in target/release/*.so; do
            [ -f "$file" ] || continue

            filename=$(basename "$file" .so)
            cp "$file" "release-files/${filename}-linux-aarch64.so"

            count=$((count + 1))
          done

          if [ "$count" -eq 0 ]; then
            echo "No Linux ARM64 shared libraries found"
            exit 1
          fi

          ls -lah release-files

      - name: Upload Linux ARM64
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: release-files/*.so
          if-no-files-found: error

  # ==========================================
  # macOS ARM64
  # ==========================================
  build-mac:
    name: Build macOS ARM64 Dylib
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build Dylib
        run: cargo build --release --target aarch64-apple-darwin

      - name: Prepare macOS ARM64 Libraries
        shell: bash
        run: |
          set -e

          mkdir -p release-files

          count=0

          for file in target/aarch64-apple-darwin/release/*.dylib; do
            [ -f "$file" ] || continue

            filename=$(basename "$file" .dylib)
            cp "$file" "release-files/${filename}-macos-aarch64.dylib"

            count=$((count + 1))
          done

          if [ "$count" -eq 0 ]; then
            echo "No macOS ARM64 dylibs found"
            exit 1
          fi

          ls -lah release-files

      - name: Upload macOS ARM64
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: release-files/*.dylib
          if-no-files-found: error

  # ==========================================
  # Publish GitHub Release
  # ==========================================
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - build-windows
      - build-linux-x86_64
      - build-linux-aarch64
      - build-mac

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List Downloaded Artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -print

      - name: Verify Release Files
        run: |
          set -e

          count=$(find artifacts -type f \
            \( -name "*.dll" -o -name "*.so" -o -name "*.dylib" \) \
            | wc -l)

          echo "Total release files: $count"

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No release files found"
            exit 1
          fi

          echo "Linux ARM64 files:"
          find artifacts -type f -name "*linux-aarch64.so" -print

          if ! find artifacts -type f -name "*linux-aarch64.so" | grep -q .; then
            echo "ERROR: Linux ARM64 libraries are missing"
            exit 1
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dll
            artifacts/**/*.so
            artifacts/**/*.dylib
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
