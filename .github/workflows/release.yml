name: Release Linux Libraries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Linux x86_64
  # 基于 CentOS 7 兼容环境构建，目标 glibc >= 2.17
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux x86_64
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -lc '
              set -e

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y

              source "$HOME/.cargo/env"

              rustup toolchain install stable
              rustup default stable

              cargo build --release
            '

      - name: Upload Linux x86_64
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: target/release/*.so
          if-no-files-found: error

  # Linux ARM64
  # 基于 glibc 2.28 环境构建，面向银河麒麟 V10 ARM64
  build-linux-aarch64:
    name: Build Linux ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux ARM64
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            quay.io/pypa/manylinux_2_28_aarch64 \
            bash -lc '
              set -e

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y

              source "$HOME/.cargo/env"

              rustup toolchain install stable
              rustup default stable

              cargo build --release
            '

      - name: Upload Linux ARM64
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: target/release/*.so
          if-no-files-found: error

  # Publish GitHub Release
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux-x86_64
      - build-linux-aarch64

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.so
          draft: false
          prerelease: false
