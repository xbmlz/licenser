name: Release Libraries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ==========================================
  # Windows x64
  # ==========================================
  build-windows:
    name: Build Windows x64 DLL
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build DLL
        run: cargo build --release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: target/release/*.dll
          if-no-files-found: error

  # ==========================================
  # Linux x86_64
  # 使用 CentOS 7 兼容环境构建
  # ==========================================
  build-linux-x86_64:
    name: Build Linux x86_64 SO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SO in CentOS 7
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            centos:7.9.2009 \
            bash -c '
              set -e

              # 修复 CentOS 7 已归档的软件源
              sed -i "s|mirrorlist=|#mirrorlist=|g" \
                /etc/yum.repos.d/CentOS-Base.repo

              sed -i "s|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" \
                /etc/yum.repos.d/CentOS-Base.repo

              yum clean all
              yum makecache

              # 安装编译工具和 OpenSSL 开发依赖
              yum groupinstall -y "Development Tools"
              yum install -y openssl-devel pkgconfig wget curl

              # 安装 Rust
              curl --proto "=https" --tlsv1.2 -sSf \
                https://sh.rustup.rs | sh -s -- -y

              source "$HOME/.cargo/env"

              # 验证 OpenSSL
              pkg-config --modversion openssl

              # 编译
              cargo build --release
            '

      - name: Upload SO
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: target/release/*.so
          if-no-files-found: error

  # ==========================================
  # Linux ARM64
  # 兼容目标：银河麒麟 V10，glibc 2.28
  # ==========================================
  build-linux-aarch64:
    name: Build Linux ARM64 SO
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SO for Kylin V10 ARM64
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            quay.io/pypa/manylinux_2_28_aarch64 \
            bash -lc '
              set -e

              # 安装 OpenSSL 开发库和 pkg-config
              yum install -y openssl-devel pkgconf-pkg-config

              # 确保 pkg-config 可以找到 OpenSSL
              export PKG_CONFIG_PATH="/usr/lib64/pkgconfig:/usr/local/lib/pkgconfig"

              # 验证 OpenSSL 开发环境
              pkg-config --modversion openssl
              pkg-config --cflags --libs openssl

              # 安装 Rust
              curl --proto "=https" --tlsv1.2 -sSf \
                https://sh.rustup.rs | sh -s -- -y

              source "$HOME/.cargo/env"

              # 确认编译架构
              rustc -vV
              uname -m

              # 编译 ARM64 动态库
              cargo build --release
            '

      - name: Check Linux ARM64 Library
        run: |
          file target/release/*.so

      - name: Upload ARM64 SO
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: target/release/*.so
          if-no-files-found: error

  # ==========================================
  # macOS ARM64
  # ==========================================
  build-mac:
    name: Build macOS ARM64 Dylib
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build Dylib
        run: cargo build --release --target aarch64-apple-darwin

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: target/aarch64-apple-darwin/release/*.dylib
          if-no-files-found: error

  # ==========================================
  # Publish GitHub Release
  # ==========================================
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - build-windows
      - build-linux-x86_64
      - build-linux-aarch64
      - build-mac

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List Artifacts
        run: find artifacts -type f

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dll
            artifacts/**/*.so
            artifacts/**/*.dylib
          draft: false
          prerelease: false
