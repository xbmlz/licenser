name: Release Licenser

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows DLL
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build DLL
        run: cargo build --release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: windows-dll
          path: target/release/*.dll

  build-linux:
    name: Build Linux musl SO
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev

      - name: Build static musl SO
        run: |
          cargo build --release --target x86_64-unknown-linux-musl

      - name: Upload musl SO
        uses: actions/upload-artifact@v4
        with:
          name: linux-musl-so
          path: target/x86_64-unknown-linux-musl/release/*.so

  build-mac:
    name: Build Mac Dylib
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build Dylib
        run: cargo build --release --target x86_64-apple-darwin

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: mac-dylib
          path: target/x86_64-apple-darwin/release/*.dylib

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-mac]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
