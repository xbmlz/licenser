[package]
name = "admin"
version = "0.1.0"
edition = "2024"

[dependencies]
core = { path = "../core" }

rocket = { version = "0.5.0", features = ["json"] }


serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-native-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }