{% extends "base.html" %}
{% block content %}
<h1>注册码管理</h1>

<form hx-post="/" hx-target="#table-container" hx-swap="outerHTML" class="mt-3" autocomplete="off"
    hx-on:htmx:afterSwap="this.reset()">
    <div class="row g-3">
        <div class="col-md-3">
            <label class="form-label">机构名称</label>
            <input name="org_name" class="form-control" placeholder="机构名称">
        </div>

        <div class="col-md-2">
            <label class="form-label">最大用户数</label>
            <input name="max_users" class="form-control" placeholder="最大用户数">
        </div>

        <div class="col-md-3">
            <label class="form-label">机器码</label>
            <input name="machine_id" class="form-control" placeholder="机器码">
        </div>

        <div class="col-md-2">
            <label class="form-label">到期时间</label>
            <input name="expires_at" type="date" class="form-control">
        </div>

        <div class="col-md-2 d-flex align-items-end">
            <button class="btn btn-primary w-100">生成</button>
        </div>
    </div>
</form>

<!-- licenses.html -->
{% include "licenses_table.html" %}

<!-- logout form -->
<form hx-post="/logout" hx-target="body" hx-swap="outerHTML" class="mt-3">
    <button class="btn btn-danger">注销</button>
</form>

{% endblock %}
